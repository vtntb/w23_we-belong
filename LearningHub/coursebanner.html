<!-- Enrol status -->
<div class="course-header">
    <div class="course-box">

        <div class="course-col">
            <p class="label">Current Status</p>
            <span class="status not-enrolled" id="courseStatus">NOT ENROLLED</span>
        </div>

        <div class="divider2"></div>

        <div class="course-col">
            <p class="label">Price</p>
            <h2 style="font-size: 18px;">Free</h2>
        </div>

        <div class="divider2"></div>

        <div class="course-col">
            <p class="label">Get Started</p>
            <button class="enrol-btn" id="enrolBtn">Register to Enroll</button>
        </div>

    </div>
</div>

<!-- Enrol Progress bar -->
<div class="course-progress" id="progressWrap" style="display:none;">
    <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
    </div>

    <div class="progress-info">
        <span id="progressText">0/0 lessons completed</span>
        <span class="progress-badge" id="progressBadge">IN PROGRESS</span>
    </div>
</div>
