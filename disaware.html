<!DOCTYPE html>
<html>
<head>
    <title>We Belong Project - Disability Support, Employment & Inclusion</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
</head>
<body data-title="Disability Awareness">
  
    <div id="header-placeholder"></div>
    <div id="banner-placeholder"></div>  

        <section class="wb-disability-section">
        <style>
            .wb-disability-section {
            background-color: #f5f5f7;
            padding: 60px 20px;
            }

            .wb-disability-container {
            max-width: 1200px;
            margin: 0 auto;
            }

            .wb-disability-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 50px 80px;
            }

            .wb-disability-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            }

            .wb-disability-title {
            font-size: 24px;
            font-weight: 500;
            color: #5c2d91;
            margin-bottom: 20px;
            }

            .wb-disability-btn {
            display: inline-block;
            background-color: #6a2c91;
            color: #fff;
            text-decoration: none;
            padding: 12px 40px;
            border-radius: 30px;
            font-size: 14px;
            width: 220px;
            text-align: center;
            transition: all 0.3s ease;
            }

            .wb-disability-btn:hover {
            background-color: #4e1f6b;
            }

            @media (max-width: 992px) {
            .wb-disability-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            }

            @media (max-width: 576px) {
            .wb-disability-grid {
                grid-template-columns: 1fr;
            }

            .wb-disability-item {
                align-items: center;
                text-align: center;
            }
            }
        </style>

        <div class="wb-disability-container">
            <div class="wb-disability-grid">

            <div class="wb-disability-item">
                <h3 class="wb-disability-title">Fact Sheets</h3>
                <a href="DisabilitiesAware/fact.html" class="wb-disability-btn">Read more</a>
            </div>


            <div class="wb-disability-item">
                <h3 class="wb-disability-title">Access Audits</h3>
                <a href="DisabilitiesAware/audit.html" class="wb-disability-btn">Read more</a>
            </div>
        </div>
        </section>

    <div id="accessibility-container"></div>
    <script src="/accessibility.js" defer></script> 

    <div id="chatbot-container"></div>
    <script src="/chatbot.js" defer></script>

    <div id="footer-placeholder"></div>
</body>
</html>
