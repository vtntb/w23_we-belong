<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>We Belong Chatbot</title>
  <link rel="stylesheet" href="chatbot.css" />
  <style>
    * {
        box-sizing: border-box;
        }

        body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #f7f7f7;
        }

        /* Floating button */
        .chat-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: #6f2c91;
        color: white;
        border: none;
        border-radius: 999px;
        padding: 14px 22px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        }

        .chat-toggle:hover {
        background: #5c2379;
        }

        /* Chat window */
        .chatbot-window {
        position: fixed;
        bottom: 85px;
        right: 20px;
        width: 360px;
        max-width: calc(100vw - 30px);
        height: 540px;
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 1000;
        border: 1px solid #ddd;
        }

        /* Header */
        .chat-header {
        background: #6f2c91;
        color: white;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        }

        .chat-header h2 {
        margin: 0;
        font-size: 20px;
        }

        .chat-header p {
        margin: 6px 0 0;
        font-size: 13px;
        }

        .close-btn {
        background: transparent;
        border: none;
        color: white;
        font-size: 28px;
        cursor: pointer;
        line-height: 1;
        }

        /* Chat body */
        .chat-body {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        background: #fafafa;
        }

        .bot-message,
        .user-message {
        max-width: 85%;
        padding: 12px 14px;
        border-radius: 14px;
        margin-bottom: 12px;
        line-height: 1.5;
        font-size: 15px;
        }

        .bot-message {
        background: #eee;
        color: #222;
        border-top-left-radius: 4px;
        }

        .user-message {
        background: #6f2c91;
        color: white;
        margin-left: auto;
        border-top-right-radius: 4px;
        }

        .consent-box {
        background: #f3e9f9;
        border: 1px solid #d6b8ea;
        }

        /* Quick buttons */
        .quick-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
        }

        .quick-buttons button {
        background: white;
        color: #6f2c91;
        border: 1px solid #6f2c91;
        border-radius: 999px;
        padding: 8px 12px;
        cursor: pointer;
        font-size: 14px;
        }

        .quick-buttons button:hover {
        background: #6f2c91;
        color: white;
        }

        /* Input area */
        .chat-input-area {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid #ddd;
        background: #fff;
        }

        .chat-input-area input {
        flex: 1;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #bbb;
        border-radius: 10px;
        outline: none;
        }

        .chat-input-area input:focus {
        border-color: #6f2c91;
        }

        .chat-input-area button {
        background: #6f2c91;
        color: white;
        border: none;
        border-radius: 10px;
        padding: 0 16px;
        font-size: 15px;
        cursor: pointer;
        }

        .chat-input-area button:hover {
        background: #5c2379;
        }

        /* Mobile */
        @media (max-width: 480px) {
        .chatbot-window {
            right: 10px;
            left: 10px;
            bottom: 80px;
            width: auto;
            height: 70vh;
        }

        .chat-toggle {
            right: 10px;
            bottom: 15px;
        }
        }
  </style>
    
</head>
<body>

  <!-- Floating Chat Button -->
  <button class="chat-toggle" id="chatToggle" aria-label="Open chatbot">
    Need Help?
  </button>

  <!-- Chat Window -->
  <section class="chatbot-window" id="chatWindow" aria-label="Chatbot" hidden>
    <div class="chat-header">
      <div>
        <h2>We Belong Helper</h2>
        <p>Simple support for finding information</p>
      </div>
      <button class="close-btn" id="closeChat" aria-label="Close chatbot">×</button>
    </div>

    <div class="chat-body" id="chatBody">
      <div class="bot-message">
        Hi, I can help you find information, explain things simply, and guide you step by step.
      </div>

      <div class="bot-message consent-box">
        I can answer questions. I only save information if you say yes.
        <div class="quick-buttons">
          <button>OK</button>
          <button>Tell me more</button>
        </div>
      </div>

      <div class="bot-message">
        What would you like help with?
        <div class="quick-buttons">
          <button onclick="sendQuickReply('Find a sport group')">Find a sport group</button>
          <button onclick="sendQuickReply('How do I join?')">How do I join?</button>
          <button onclick="sendQuickReply('Tell my story')">Tell my story</button>
          <button onclick="sendQuickReply('Help for clubs/coaches')">Help for clubs/coaches</button>
        </div>
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input
        type="text"
        id="userInput"
        placeholder="Type your question here..."
        aria-label="Type your message"
      />
      <button type="submit">Send</button>
    </form>
  </section>

  <script src="chatbot.js"></script>
</body>
</html>
