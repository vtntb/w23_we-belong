<style>
.wb-accessibility .accessibility-btn {
  position: fixed;
  bottom: 90px;
  left: 20px;
  z-index: 1000;
  background: #2f80c1;
  color: white;
  border: none;
  border-radius: 50%;
  width: 58px;
  height: 58px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.wb-accessibility .accessibility-btn img {
  width: 36px;
  height: 36px;
  display: block;
  margin: 0;
}

.wb-accessibility .accessibility-btn:hover {
  background: #24679b;
}

.wb-accessibility .toolbar {
  position: fixed;
  top: 200px;
  left: 20px;
  width: 360px;
  max-width: calc(100vw - 40px);
  background: #efefef;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  z-index: 1001;
  overflow: hidden;
}

.wb-accessibility .toolbar[hidden] {
  display: none !important;
}

.wb-accessibility .toolbar-header {
  background: #2f80c1;
  color: white;
  padding: 16px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.wb-accessibility .toolbar-header h2 {
  margin: 0;
  font-size: 20px;
  font-weight: 600;
}

.wb-accessibility .toolbar-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
}

.wb-accessibility .toolbar-body {
  display: flex;
  flex-direction: column;
}

.wb-accessibility .toolbar-item,
.wb-accessibility .toolbar-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-top: 1px solid #d8d8d8;
  background: #efefef;
  font-size: 15px;
}

.wb-accessibility .toolbar-item-label,
.wb-accessibility .toolbar-action-label {
  display: flex;
  align-items: center;
  gap: 12px;
}

.wb-accessibility .toolbar-action {
  width: 100%;
  border-left: none;
  border-right: none;
  border-bottom: none;
  cursor: pointer;
  text-align: left;
}

.wb-accessibility .toolbar-action:hover {
  background: #e6e6e6;
}

.wb-accessibility .toolbar-icon {
  width: 18px;
  text-align: center;
  font-size: 16px;
}

.wb-accessibility .switch {
  position: relative;
  display: inline-block;
  width: 54px;
  height: 30px;
  flex-shrink: 0;
}

.wb-accessibility .switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.wb-accessibility .slider {
  position: absolute;
  inset: 0;
  background-color: #bfbfbf;
  transition: 0.25s;
  border-radius: 999px;
  cursor: pointer;
}

.wb-accessibility .slider:before {
  content: "";
  position: absolute;
  width: 24px;
  height: 24px;
  left: 3px;
  top: 3px;
  background-color: white;
  transition: 0.25s;
  border-radius: 50%;
}

.wb-accessibility .switch input:checked + .slider {
  background-color: #3f90c9;
}

.wb-accessibility .switch input:checked + .slider:before {
  transform: translateX(24px);
}

@media (max-width: 480px) {
  .wb-accessibility .toolbar {
    top: 60px;
    left: 10px;
    width: calc(100vw - 20px);
  }

  .wb-accessibility .accessibility-btn {
    left: 10px;
    bottom: 85px;
  }
}
</style>

<div class="wb-accessibility">
  <button id="accessibilityBtn" class="accessibility-btn" aria-label="Open accessibility toolbar">
    <img src="/images/AdditionalIMG/accessibility.png" alt="Accessibility Icon">
  </button>

  <div id="accessibilityToolbar" class="toolbar" hidden>
    <div class="toolbar-header">
      <h2>Accessibility Toolbar</h2>
      <button id="closeAccessibility" class="toolbar-close" aria-label="Close accessibility toolbar">×</button>
    </div>

    <div class="toolbar-body">
      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/keyboard.png" alt="Keyboard Navigation Icon" style="width: 24px; height: 24px;"></span>
          <span>Keyboard Navigation</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="keyboardNavToggle">
          <span class="slider"></span>
        </span>
      </label>

      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/disable-animations.png" alt="Disable Animations Icon" style="width: 18px; height: 18px;"></span>
          <span>Disable Animations</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="disableAnimationsToggle">
          <span class="slider"></span>
        </span>
      </label>

      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/contrast.png" alt="Contrast Icon" style="width: 18px; height: 18px;"></span>
          <span>Contrast</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="contrastToggle">
          <span class="slider"></span>
        </span>
      </label>

      <button type="button" class="toolbar-action" id="increaseTextBtn">
        <span class="toolbar-action-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/increase-text.png" alt="Increase Text Icon" style="width: 27px; height: 27px;"></span>
          <span>Increase Text</span>
        </span>
        <span>+</span>
      </button>

      <button type="button" class="toolbar-action" id="decreaseTextBtn">
        <span class="toolbar-action-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/decrease-text.png" alt="Decrease Text Icon" style="width: 27px; height: 27px;"></span>
          <span>Decrease Text</span>
        </span>
        <span>−</span>
      </button>

      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/readable-font.png" alt="Readable Font Icon" style="width: 27px; height: 27px;"></span>
          <span>Readable Font</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="readableFontToggle">
          <span class="slider"></span>
        </span>
      </label>

      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/mark-titles.png" alt="Mark Titles Icon" style="width: 27px; height: 27px;"></span>
          <span>Mark Titles</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="markTitlesToggle">
          <span class="slider"></span>
        </span>
      </label>

      <label class="toolbar-item">
        <span class="toolbar-item-label">
          <span class="toolbar-icon"><img src="/images/AdditionalIMG/highlight-links.png" alt="Highlight Links & Buttons Icon" style="width: 24px; height: 24px;"></span>
          <span>Highlight Links & Buttons</span>
        </span>
        <span class="switch">
          <input type="checkbox" id="highlightLinksToggle">
          <span class="slider"></span>
        </span>
      </label>
    </div>

  </div>
</div>
