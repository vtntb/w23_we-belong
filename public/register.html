<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - We Belong Project</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css" type="text/css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <style>
        .register-wrap {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .register-card {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
        }

        .register-left {
            background: #f3eafd;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .register-left img {
            width: 220px;
            max-width: 100%;
            margin: 0 auto 20px;
        }

        .register-left h2 {
            color: #6f2c91;
            font-size: 34px;
            margin-bottom: 16px;
        }

        .register-left p {
            font-size: 20px;
            line-height: 1.7;
            margin: 0 auto;
            max-width: 420px;
        }

        .register-right {
            padding: 50px 40px;
        }

        .register-right h2 {
            color: #6f2c91;
            font-size: 36px;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .register-subtext {
            font-size: 18px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .register-form label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .register-form input {
            width: 100%;
            padding: 15px 16px;
            font-size: 17px;
            border: 2px solid #d9c8e7;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .register-form input:focus {
            border-color: #6f2c91;
            box-shadow: 0 0 0 4px rgba(111, 44, 145, 0.12);
        }

        .terms-box {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 16px;
            line-height: 1.6;
        }

        .terms-box input {
            width: auto;
            margin-top: 4px;
        }

        .register-btn {
            background: #6f2c91;
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #562071;
        }

        .error-message {
            display: none;
            color: #c62828;
            font-size: 16px;
        }

        .success-message {
            display: none;
            color: #1f6b1f;
            font-size: 16px;
        }

        .login-text {
            margin-top: 20px;
            font-size: 17px;
            text-align: center;
        }

        .login-text a {
            color: #6f2c91;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .register-card {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .register-left,
            .register-right {
                padding: 35px 24px;
            }
        }
    </style>
</head>

<body data-title="Register">

    <div id="header-placeholder"></div>
    <div id="banner-placeholder"></div>

    <main class="register-wrap">
        <div class="register-card">
            <div class="register-left">
                <img src="images/Logo/We-Belong_Logo.png" alt="Register illustration">
                <h2>Start Your Journey</h2>
                <p>
                    Create an account to access courses, track your progress, and explore We Belong resources.
                </p>
            </div>

            <div class="register-right">
                <h2>Create Account</h2>
                <p class="register-subtext">
                    Fill in your details below to create your account.
                </p>

                <form class="register-form" id="registerForm">
                    <div class="form-row">
                        <div>
                            <label for="firstName">First Name</label>
                            <input type="text" id="firstName" placeholder="Enter first name">
                        </div>

                        <div>
                            <label for="lastName">Last Name</label>
                            <input type="text" id="lastName" placeholder="Enter last name">
                        </div>
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Create a password">
                    </div>

                    <div>
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter password">
                    </div>

                    <label class="terms-box">
                        <input type="checkbox" id="agreeTerms">
                        <span>I agree to the terms and understand this is a demonstration account system.</span>
                    </label>

                    <div class="error-message" id="errorMessage"></div>
                    <div class="success-message" id="successMessage">Account created successfully. Redirecting to login...</div>

                    <button type="submit" class="register-btn">Create Account</button>
                </form>

                <p class="login-text">
                    Already have an account?
                    <a href="login.html">Log in here</a>
                </p>
            </div>
        </div>
    </main>

    <div id="accessibility-container"></div>
    <script src="js/accessibility.js" defer></script> 
    
    <div id="chatbot-container"></div>
    <script src="js/chatbot.js" defer></script>

    <div id="footer-placeholder"></div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const firstName = document.getElementById("firstName").value.trim();
            const lastName = document.getElementById("lastName").value.trim();
            const email = document.getElementById("email").value.trim().toLowerCase();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const agreeTerms = document.getElementById("agreeTerms").checked;

            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");
            const registerBtn = document.querySelector(".register-btn");

            errorMessage.style.display = "none";
            successMessage.style.display = "none";
            errorMessage.textContent = "";

            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                errorMessage.textContent = "Please complete all fields.";
                errorMessage.style.display = "block";
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = "Passwords do not match.";
                errorMessage.style.display = "block";
                return;
            }

            if (!agreeTerms) {
                errorMessage.textContent = "Please agree to the terms.";
                errorMessage.style.display = "block";
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = "Creating account...";

            try {
                const response = await fetch("/api/auth/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        firstName,
                        lastName,
                        email,
                        password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMessage.textContent = data.error || "Could not create account.";
                    errorMessage.style.display = "block";
                    return;
                }

                successMessage.style.display = "block";

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1500);

            } catch (err) {
                errorMessage.textContent = "Could not connect to server. Please try again.";
                errorMessage.style.display = "block";
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
