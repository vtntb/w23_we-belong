<!DOCTYPE html>
<html>
<head>
    <title>We Belong Project - Disability Support, Employment & Inclusion</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" type="text/css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>

    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    .contact-page,
    .contact-section,
    .contact-wrapper,
    .contact-left,
    .contact-right,
    .contact-form {
        box-sizing: border-box;
    }

    .contact-page {
        width: 100%;
        overflow-x: hidden;
    }

    .contact-section {
        width: 100%;
        padding: 50px 20px;
    }

    .contact-wrapper {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        display: flex;
        gap: 40px;
        align-items: flex-start;
    }

    .contact-left,
    .contact-right {
        flex: 1;
        min-width: 0;
    }

    .contact-form {
        width: 100%;
        max-width: 100%;
        padding: 35px;
        background: #ffffff;
        border-radius: 10px;
    }

    .form-row {
        display: flex;
        gap: 20px;
        width: 100%;
    }

    .form-group {
        flex: 1;
        min-width: 0;
    }

    .contact-form label {
        display: block;
        margin: 16px 0 8px;
        font-weight: bold;
    }

    .contact-form input,
    .contact-form select,
    .contact-form textarea {
        display: block;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        font-size: 16px;
        border: 1px solid #cfcfcf;
        border-radius: 6px;
    }

    .contact-form textarea {
        resize: vertical;
        min-height: 120px;
    }

    .contact-form button {
        margin-top: 20px;
        background: #6f2c91;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 25px;
        cursor: pointer;
    }

    .contact-form button:hover {
        background: #4f186b;
    }

    .contact-info-box,
    .contact-item,
    .contact-item p,
    .contact-item a {
        max-width: 100%;
        overflow-wrap: break-word;
        word-break: break-word;
    }

    @media screen and (max-width: 768px) {

        .contact-section {
            padding: 30px 16px;
        }

        .contact-wrapper {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 100%;
        }

        .contact-left,
        .contact-right {
            width: 100%;
            max-width: 100%;
        }

        .contact-left h2 {
            font-size: 28px;
            margin-top: 0;
        }

        .contact-intro {
            font-size: 16px;
            line-height: 1.5;
        }

        .contact-info-box {
            width: 100%;
            max-width: 100%;
        }

        .contact-form {
            width: 100%;
            max-width: 100%;
            padding: 24px 18px;
            border-radius: 8px;
        }

        .contact-form h3 {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 18px;
        }

        .form-row {
            flex-direction: column;
            gap: 0;
        }

        .form-group {
            width: 100%;
        }

        .contact-form label {
            font-size: 16px;
            margin: 14px 0 7px;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            width: 100%;
            max-width: 100%;
            font-size: 16px;
            padding: 12px;
        }

        .contact-form textarea {
            min-height: 110px;
        }

        .contact-form button {
            display: block;
            width: 100%;
            max-width: 220px;
            margin: 22px auto 0;
            text-align: center;
        }

        .social-icons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
    }

    @media screen and (max-width: 480px) {

        .contact-section {
            padding: 25px 12px;
        }

        .contact-form {
            padding: 22px 14px;
        }

        .contact-form h3 {
            font-size: 22px;
        }

        .contact-left h2 {
            font-size: 26px;
        }

        .contact-form input,
        .contact-form select,
        .contact-form textarea {
            font-size: 15px;
        }
    }
</style>
</head>

<body data-title="Contact Us">
  
    <div id="header-placeholder"></div>
    <div id="banner-placeholder"></div>  

    <!-- page content -->
    <main class="contact-page">
        <section class="contact-section">
            <div class="contact-wrapper">

                <div class="contact-left">
                    <h2>Contact Us</h2>

                    <p class="contact-intro">
                        Get in touch with us to learn more about We Belong programs, support, and opportunities.
                    </p>

                    <div class="contact-info-box">
                        <h3>The Flagstaff Group</h3>

                        <div class="contact-item">
                            <span class="contact-label">Address:</span>
                            <p>254 Nolan St, Unanderra NSW 2526</p>
                        </div>

                        <div class="contact-item">
                            <span class="contact-label">Phone:</span>
                            <p><a href="tel:0242720222">(02) 4272 0222</a></p>
                        </div>

                        <div class="contact-item">
                            <span class="contact-label">Email:</span>
                            <p>
                                <a href="mailto:lifechoices.illawarra@flagstaffgroup.com.au">
                                    lifechoices.illawarra@flagstaffgroup.com.au
                                </a>
                            </p>
                        </div>
                    </div>

                    <div class="social-icons">
                        <a href="https://www.facebook.com/flagstaffgroup/" target="_blank" class="facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>

                        <a href="https://www.linkedin.com/company/the-flagstaff-group/" target="_blank" class="linkedin">
                            <i class="fab fa-linkedin-in"></i>
                        </a>

                        <a href="https://www.instagram.com/flagstaff_group/" target="_blank" class="instagram">
                            <i class="fab fa-instagram"></i>
                        </a>

                        <a href="https://www.youtube.com/user/TheFlagstaffGroup" target="_blank" class="youtube">
                            <i class="fab fa-youtube"></i>
                        </a>
                    </div>
                </div>

                <div class="contact-right">
                    <form class="contact-form">
                        <h3>Send us a message</h3>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="fname">First Name *</label>
                                <input type="text" id="fname" name="fname" required>
                            </div>

                            <div class="form-group">
                                <label for="lname">Last Name *</label>
                                <input type="text" id="lname" name="lname" required>
                            </div>
                        </div>

                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>

                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>

                        <label for="program">Program of Interest</label>
                        <select id="program" name="program">
                            <option value="">Select a program</option>
                            <option>Learning Hub</option>
                            <option>Inclusive Employment</option>
                            <option>Sport & Recreation</option>
                            <option>Disability Awareness</option>
                        </select>

                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"></textarea>
                        <p id="contactFormMessage" style="display:none;"></p>
                        <button type="submit">Submit</button>
                    </form>
                </div>

            </div>
        </section>
    </main>

    <div id="accessibility-container"></div>
    <script src="js/accessibility.js" defer></script> 

    <div id="chatbot-container"></div>
    <script src="js/chatbot.js" defer></script>

    <div id="footer-placeholder"></div>

    <script>
        document.querySelector(".contact-form").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = {
                firstName: document.getElementById("fname").value,
                lastName: document.getElementById("lname").value,
                phone: document.getElementById("phone").value,
                email: document.getElementById("email").value,
                program: document.getElementById("program").value,
                message: document.getElementById("message").value
            };

            try {
                const response = await fetch("/api/contact", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                const messageBox = document.getElementById("contactFormMessage");

                if (!response.ok) {
                    messageBox.style.display = "block";
                    messageBox.style.color = "red";
                    messageBox.innerText = data.error || "Something went wrong. Please try again.";
                    return;
                }

                messageBox.style.display = "block";
                messageBox.style.color = "green";
                messageBox.innerText = "Thank you. Your message has been submitted.";

                this.reset();
            } catch (err) {
                const messageBox = document.getElementById("contactFormMessage");
                messageBox.style.display = "block";
                messageBox.style.color = "red";
                messageBox.innerText = "Could not submit message. Please try again later.";
            }
        });
    </script>
</body>
</html>
