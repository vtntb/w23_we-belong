<!DOCTYPE html>
<html>
<head>
    <title>Lesson 3 – Lived Experience Video</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../css/style.css">
    <link rel="stylesheet" href="../../../css/learninghub.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../../../js/script.js" defer></script>
    <script src="../../../js/learninghub.js" defer></script>

    <style>
        .lessonnav {
            padding: 15px 180px;
            background: #eceaea;
            font-size: 15px;
            box-sizing: border-box;
            line-height: 1.5;
        }

        .lessonnav a {
            color: #6f2c91;
            text-decoration: none;
            font-weight: 600;
        }

        .lessonnav a:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Video container */
        .viddiv {
            text-align: center;
            margin: 60px auto;
            padding: 0 180px;
            box-sizing: border-box;
            width: 100%;
        }

        .vidTitle {
            color: red;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 18px;
            line-height: 1.4;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Complete button section */
        .lesson-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            margin: 60px 0;
            padding: 0 180px;
            box-sizing: border-box;
        }

        #lessonDoneMsg {
            margin-top: 15px;
            color: green;
            font-size: 18px;
            text-align: center;
        }

        .navigationdiv {
            margin-top: 20px;
            width: 100%;
            max-width: 1600px;
        }

        .naviBar {
            width: 100%;
            height: 1px;
            background: #aba8a8;
            margin: 20px auto 30px;
        }

        .buttonDiv {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            gap: 15px;
        }

        .buttonDiv a:first-child {
            justify-self: start;
        }

        .buttonDiv a:nth-child(2) {
            justify-self: center;
        }

        .buttonDiv a:last-child {
            justify-self: end;
        }

        .naviButt {
            background: #6f2c91;
            color: white;
            text-decoration: none;
            padding: 12px 22px;
            border-radius: 25px;
            font-size: 16px;
            transition: 0.2s;
            text-align: center;
            box-sizing: border-box;
        }

        .naviButt:hover {
            background: #4f186b;
        }

        @media screen and (max-width: 768px) {
            .lessonnav {
                padding: 14px 20px;
                font-size: 14px;
            }

            .lessonnav a,
            .lessonnav span {
                display: inline;
                overflow-wrap: break-word;
            }

            .viddiv {
                padding: 0 20px;
                margin: 40px auto;
            }

            .vidTitle {
                font-size: 16px;
                margin-bottom: 16px;
            }

            .video-wrapper {
                width: 100%;
                max-width: 100%;
                aspect-ratio: 16 / 9;
            }

            .lesson-actions {
                margin: 40px 0;
                padding: 0 20px;
            }

            #markCompleteBtn {
                width: fit-content;
                max-width: 100%;
                text-align: center;
            }

            #lessonDoneMsg {
                font-size: 16px;
            }

            .navigationdiv {
                width: 100%;
                margin-top: 25px;
            }

            .buttonDiv {
                display: flex;
                flex-direction: column;
                gap: 14px;
                width: 100%;
            }

            .buttonDiv a:first-child,
            .buttonDiv a:nth-child(2),
            .buttonDiv a:last-child {
                justify-self: unset;
            }

            .naviButt {
                display: block;
                width: 100%;
                max-width: 260px;
                padding: 12px 18px;
            }
        }

        @media screen and (max-width: 480px) {
            .lessonnav {
                padding: 12px 16px;
                font-size: 13px;
            }

            .viddiv {
                padding: 0 16px;
                margin: 35px auto;
            }

            .vidTitle {
                font-size: 15px;
            }

            .lesson-actions {
                padding: 0 16px;
            }

            .naviButt {
                max-width: 100%;
                font-size: 15px;
            }
        }
    </style>
</head>

        <!-- lesson navigation -->
        <div class="navigationdiv">

                <a href="lesson4.html" class="naviButt">Next →</a>
            </div>
        </div>
    </div>

    <div id="accessibility-container"></div>
    <script src="../../../js/accessibility.js" defer></script> 
    
    <div id="chatbot-container"></div>

    <div id="footer-placeholder"></div>

</body>
