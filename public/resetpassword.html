<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Password - We Belong</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="css/style.css" type="text/css">
    <link rel="icon" type="image/png" href="/images/Logo/WeBelong.png">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f4fb;
            color: #222;
        }

        .reset-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .reset-hero {
            background: linear-gradient(rgba(111,44,145,0.88), rgba(111,44,145,0.88)),
                        url("images/home-page-banner.jpg") center/cover no-repeat;
            color: white;
            text-align: center;
            padding: 70px 20px 120px;
        }

        .reset-hero h1 {
            font-size: 48px;
            margin: 0 0 15px;
            font-weight: bold;
        }

        .reset-hero p {
            font-size: 22px;
            margin: 0 auto;
            max-width: 800px;
            line-height: 1.6;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 800px;
            margin: -70px auto 60px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .reset-card {
            background: white;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            padding: 50px;
            box-sizing: border-box;
        }

        .reset-card h2 {
            font-size: 38px;
            margin: 0 0 12px;
            color: #6f2c91;
            text-align: center;
        }

        .subtext {
            font-size: 18px;
            margin-bottom: 30px;
            color: #555;
            line-height: 1.6;
            text-align: center;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .reset-form label {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
        }

        .reset-form input {
            width: 100%;
            padding: 16px 18px;
            font-size: 18px;
            border: 2px solid #d9c8e7;
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .reset-form input:focus {
            border-color: #6f2c91;
            box-shadow: 0 0 0 4px rgba(111,44,145,0.12);
        }

        .question-box {
            background: #f7f1fc;
            border-left: 6px solid #6f2c91;
            padding: 18px 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
        }

        .reset-btn {
            background: #6f2c91;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 18px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #5a2377;
        }

        .message-box {
            display: none;
            font-size: 17px;
            line-height: 1.5;
            padding: 14px 16px;
            border-radius: 10px;
        }

        .message-success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .message-error {
            display: block;
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }

        .back-login {
            margin-top: 25px;
            font-size: 18px;
            text-align: center;
        }

        .back-login a {
            color: #6f2c91;
            font-weight: bold;
            text-decoration: none;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .reset-hero {
                padding: 50px 15px 100px;
            }

            .reset-hero h1 {
                font-size: 36px;
            }

            .reset-hero p {
                font-size: 19px;
            }

            .reset-card {
                padding: 35px 25px;
            }

            .reset-card h2 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body data-title="Reset Password">

    <div id="header-placeholder"></div>

    <main class="reset-page">
        <section class="reset-hero">
            <h1>Reset Password</h1>
            <p>
                Answer your backup question and create a new password for your We Belong account.
            </p>
        </section>

        <section class="reset-wrapper">
            <div class="reset-card">
                <h2>Create New Password</h2>

                <p class="subtext">
                    Please answer your backup question before changing your password.
                </p>

                <form class="reset-form" id="resetPasswordForm">
                    <div>
                        <label>Email Address</label>
                        <input type="email" id="email" readonly>
                    </div>

                    <div class="question-box">
                        <strong>Backup Question:</strong>
                        <p id="backupQuestion">Loading question...</p>
                    </div>

                    <div>
                        <label for="backupAnswer">Backup Answer</label>
                        <input type="text" id="backupAnswer" placeholder="Enter your backup answer" required>
                    </div>

                    <div>
                        <label for="newPassword">New Password</label>
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                    </div>

                    <div>
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" placeholder="Re-enter new password" required>
                    </div>

                    <p id="resetMessage" class="message-box"></p>

                    <button type="submit" class="reset-btn">Reset Password</button>
                </form>

                <p class="back-login">
                    Remember your password?
                    <a href="login.html">Back to Login</a>
                </p>
            </div>
        </section>
    </main>

    <div id="accessibility-container"></div>
    <script src="js/accessibility.js" defer></script> 

    <div id="chatbot-container"></div>
    <script src="js/chatbot.js" defer></script>

    <div id="footer-placeholder"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const emailFromUrl = params.get("email");

        const emailInput = document.getElementById("email");
        const backupQuestionText = document.getElementById("backupQuestion");
        const messageBox = document.getElementById("resetMessage");

        emailInput.value = emailFromUrl || "";

        async function loadBackupQuestion() {
            if (!emailFromUrl) {
                messageBox.className = "message-box message-error";
                messageBox.textContent = "No email address was provided. Please go back to Forgot Password.";
                backupQuestionText.textContent = "No question available.";
                return;
            }

            try {
                const response = await fetch("/api/auth/check-reset-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: emailFromUrl })
                });

                const data = await response.json();

                if (!response.ok) {
                    messageBox.className = "message-box message-error";
                    messageBox.textContent = data.error || "Could not load backup question.";
                    backupQuestionText.textContent = "No question available.";
                    return;
                }

                backupQuestionText.textContent = data.backupQuestion;
            } catch (err) {
                messageBox.className = "message-box message-error";
                messageBox.textContent = "Could not connect to server.";
                backupQuestionText.textContent = "No question available.";
            }
        }

        document.getElementById("resetPasswordForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = emailInput.value.trim().toLowerCase();
            const backupAnswer = document.getElementById("backupAnswer").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            messageBox.className = "message-box";
            messageBox.textContent = "";

            if (!email || !backupAnswer || !newPassword || !confirmPassword) {
                messageBox.classList.add("message-error");
                messageBox.textContent = "Please complete all fields.";
                return;
            }

            if (newPassword.length < 6) {
                messageBox.classList.add("message-error");
                messageBox.textContent = "Password must be at least 6 characters.";
                return;
            }

            if (newPassword !== confirmPassword) {
                messageBox.classList.add("message-error");
                messageBox.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        backupAnswer: backupAnswer,
                        newPassword: newPassword
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    messageBox.classList.add("message-error");
                    messageBox.textContent = data.error || "Could not reset password.";
                    return;
                }

                messageBox.classList.add("message-success");
                messageBox.textContent = "Password reset successful. Redirecting to login...";

                setTimeout(function () {
                    window.location.href = "login.html";
                }, 1800);
            } catch (err) {
                messageBox.classList.add("message-error");
                messageBox.textContent = "Could not connect to server. Please try again.";
            }
        });

        loadBackupQuestion();
    </script>
</body>
</html>
